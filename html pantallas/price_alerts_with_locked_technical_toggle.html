<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Stock Price Alerts</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#e1e2e7",
                        "surface-dim": "#111417",
                        "surface-container": "#1d2023",
                        "surface-variant": "#323538",
                        "surface-container-high": "#272a2e",
                        "surface-container-lowest": "#0b0e11",
                        "tertiary": "#afc8ff",
                        "on-secondary": "#690003",
                        "outline": "#86957e",
                        "on-tertiary": "#002e69",
                        "primary": "#3de530",
                        "on-primary": "#003a00",
                        "on-secondary-container": "#ffd2cc",
                        "error-container": "#93000a",
                        "tertiary-fixed-dim": "#adc6ff",
                        "on-tertiary-fixed": "#001a41",
                        "primary-container": "#00c805",
                        "background": "#111417",
                        "secondary": "#ffb4aa",
                        "primary-fixed": "#77ff62",
                        "surface-bright": "#37393d",
                        "on-background": "#e1e2e7",
                        "on-error-container": "#ffdad6",
                        "outline-variant": "#3d4b37",
                        "on-secondary-fixed-variant": "#930005",
                        "error": "#ffb4ab",
                        "secondary-fixed": "#ffdad5",
                        "on-primary-fixed": "#002200",
                        "on-tertiary-fixed-variant": "#004493",
                        "on-surface-variant": "#bbcbb2",
                        "inverse-on-surface": "#2e3134",
                        "inverse-surface": "#e1e2e7",
                        "tertiary-container": "#82acff",
                        "primary-fixed-dim": "#3ce42f",
                        "surface-container-low": "#191c1f",
                        "secondary-fixed-dim": "#ffb4aa",
                        "on-primary-container": "#004c00",
                        "on-primary-fixed-variant": "#005300",
                        "surface": "#111417",
                        "on-tertiary-container": "#003e87",
                        "inverse-primary": "#006e01",
                        "surface-tint": "#3ce42f",
                        "on-error": "#690005",
                        "tertiary-fixed": "#d8e2ff",
                        "on-secondary-fixed": "#410001",
                        "surface-container-highest": "#323538",
                        "secondary-container": "#c5020b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "xs": "4px",
                        "xl": "32px",
                        "md": "16px",
                        "base": "4px",
                        "margin": "20px",
                        "sm": "8px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "title-lg": ["Inter"],
                        "label-md": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #0b0e11;
            color: #e1e2e7;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Hide scrollbar for a cleaner look but keep functionality */
        ::-webkit-scrollbar {
            display: none;
        }
        
        /* Range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #00c805;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 0 10px rgba(0, 200, 5, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #323538;
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface-container-lowest min-h-screen flex flex-col pb-24 font-body-lg text-body-lg text-on-surface">
<!-- TopAppBar -->
<header class="bg-surface-dim dark:bg-surface-dim docked full-width top-0 border-b border-outline-variant dark:border-outline-variant flat no shadows flex justify-between items-center w-full px-margin h-12 sticky z-40">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary dark:text-primary" data-icon="monitoring">monitoring</span>
<span class="font-headline-md text-headline-md-mobile font-bold text-primary dark:text-primary">AlphaStream</span>
</div>
<div class="flex items-center gap-sm">
<button class="text-on-surface-variant hover:bg-surface-variant/50 transition-colors p-sm rounded-full">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</div>
</header>
<main class="flex-1 px-margin pt-lg max-w-lg mx-auto w-full">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-md">Set Alert</h1>
<!-- Toggle Component -->
<div class="bg-surface-container p-1 rounded-lg flex mb-lg border border-surface-variant">
<button class="flex-1 py-sm rounded-md bg-surface-variant text-on-surface font-title-lg text-title-lg shadow-sm transition-all" onclick="document.getElementById('alert-type').innerText = 'Price threshold alert'">
                Price
            </button>
<button class="flex-1 py-sm rounded-md text-on-surface-variant/40 font-title-lg text-title-lg transition-all flex items-center justify-center gap-xs cursor-not-allowed" disabled="">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">lock</span>
                Technical
            </button>
</div>
<!-- Alert Configuration Card -->
<div class="bg-surface-dim border border-outline-variant rounded-lg p-md mb-xl shadow-lg relative overflow-hidden">
<!-- Glassmorphic flair -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full blur-xl -mr-16 -mt-16 pointer-events-none"></div>
<div class="flex justify-between items-center mb-md">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 bg-surface-variant rounded-full flex items-center justify-center border border-outline-variant">
<span class="font-headline-md text-headline-md-mobile text-on-surface">T</span>
</div>
<div>
<div class="font-headline-md text-headline-md-mobile text-on-surface">TSLA</div>
<div class="font-body-md text-body-md text-on-surface-variant">Tesla Inc.</div>
</div>
</div>
<div class="text-right">
<div class="font-title-lg text-title-lg text-on-surface">$175.22</div>
<div class="font-label-md text-label-md text-primary flex items-center justify-end">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">arrow_upward</span>
                        1.2%
                    </div>
</div>
</div>
<div class="mb-sm text-on-surface-variant font-label-md text-label-md uppercase tracking-wider" id="alert-type">Price threshold alert</div>
<div class="flex items-baseline gap-xs mb-lg">
<span class="font-display-lg text-display-lg text-on-surface" id="slider-value">5.0</span>
<span class="font-headline-md text-headline-md text-on-surface-variant">%</span>
</div>
<input class="mb-lg" max="20" min="0.1" oninput="document.getElementById('slider-value').innerText = this.value" step="0.1" type="range" value="5"/>
<div class="flex gap-sm">
<button class="flex-1 bg-surface-variant border border-outline-variant text-on-surface py-md rounded-md font-title-lg text-title-lg hover:bg-surface-container-high transition-colors">
                    Cancel
                </button>
<button class="flex-1 bg-primary-container text-on-primary py-md rounded-md font-title-lg text-title-lg font-bold hover:opacity-90 transition-opacity shadow-[0_0_15px_rgba(0,200,5,0.3)]">
                    Create Alert
                </button>
</div>
</div>
<h2 class="font-title-lg text-title-lg text-on-surface mb-md">Active Alerts</h2>
<!-- Active Alerts List -->
<div class="flex flex-col gap-sm">
<!-- Alert Item 1 -->
<div class="bg-surface-container-low border border-outline-variant rounded-md p-sm flex justify-between items-center group hover:border-primary/50 transition-colors cursor-pointer">
<div class="flex items-center gap-md">
<div class="w-12 h-12 flex flex-col items-center justify-center bg-surface-variant rounded-md border border-outline-variant">
<span class="font-label-md text-label-md text-on-surface-variant">BTC</span>
</div>
<div>
<div class="font-title-lg text-title-lg text-on-surface">Bitcoin</div>
<div class="font-label-md text-label-md text-primary flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]">trending_up</span>
                            Crosses above $65,000
                        </div>
</div>
</div>
<button class="text-on-surface-variant hover:text-error transition-colors p-xs">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
<!-- Alert Item 2 -->
<div class="bg-surface-container-low border border-outline-variant rounded-md p-sm flex justify-between items-center group hover:border-primary/50 transition-colors cursor-pointer">
<div class="flex items-center gap-md">
<div class="w-12 h-12 flex flex-col items-center justify-center bg-surface-variant rounded-md border border-outline-variant">
<span class="font-label-md text-label-md text-on-surface-variant">AAPL</span>
</div>
<div>
<div class="font-title-lg text-title-lg text-on-surface">Apple Inc.</div>
<div class="font-label-md text-label-md text-error flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]">trending_down</span>
                            Drops &gt; 3%
                        </div>
</div>
</div>
<button class="text-on-surface-variant hover:text-error transition-colors p-xs">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface-container-lowest dark:bg-surface-container-lowest border-t border-outline-variant dark:border-outline-variant fixed bottom-0 w-full z-50 shadow-lg fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="star">star</span>
<span class="font-label-md text-label-md">Favorites</span>
</a>
<!-- Active Tab -->
<a class="flex flex-col items-center justify-center text-primary bg-primary-container/10 rounded-xl px-3 py-1 hover:text-primary transition-all scale-90" href="#">
<span class="material-symbols-outlined mb-1" data-icon="notifications" style="font-variation-settings: 'FILL' 1;">notifications</span>
<span class="font-label-md text-label-md font-bold">Alerts</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-md text-label-md">Profile</span>
</a>
</nav>
</body></html>
