name: Test splits

on:
  push:
    paths:
      - 'test_splits.py'
      - '.github/workflows/test-splits.yml'

jobs:
  run-test-splits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pandas yfinance
      - name: Run split test
        run: python3 test_splits.py
