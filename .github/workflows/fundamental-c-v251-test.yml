name: Fundamental C v2.5.1 test

on:
  push:
    paths:
      - 'fundamental_c.py'
      - '.github/workflows/fundamental-c-v251-test.yml'

jobs:
  run-fundamental-c-v251:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pandas yfinance
      - name: Run fundamental C v2.5.1
        run: python3 fundamental_c.py
