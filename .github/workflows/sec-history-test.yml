name: SEC Yahoo hybrid test

on:
  push:
    paths:
      - 'test_sec_history.py'
      - '.github/workflows/sec-history-test.yml'

jobs:
  run-hybrid-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pandas yfinance
      - name: Run hybrid SEC Yahoo test
        run: python3 test_sec_history.py
