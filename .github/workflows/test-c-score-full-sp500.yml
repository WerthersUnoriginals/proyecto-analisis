name: Test C Score full S&P 500

on:
  push:
    paths:
      - '.github/workflows/test-c-score-full-sp500.yml'

jobs:
  full-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pandas yfinance lxml
      - name: Run full S&P 500 validation
        run: python3 test_c_score_full_sp500.py
      - name: Upload full CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp500-c-score-full-results
          path: sp500_c_score_full_results.csv
          if-no-files-found: warn
