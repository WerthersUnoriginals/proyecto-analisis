name: Test C Score v1.2 low persistence cases

on:
  push:
    paths:
      - '.github/workflows/test-c-score-v12-low-persistence.yml'
  workflow_dispatch:

jobs:
  targeted-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pandas yfinance lxml
      - name: Compile modules
        run: python3 -m py_compile c_score_v1.py fundamental_c.py test_c_score_v12_low_persistence_cases.py
      - name: Run targeted validation
        run: python3 test_c_score_v12_low_persistence_cases.py
      - name: Upload targeted CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c-score-v12-low-persistence-cases
          path: c_score_v12_low_persistence_cases.csv
          if-no-files-found: warn
